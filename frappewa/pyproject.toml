[project]
name = "frappewa"
authors = [
    { name = "FrappeWA Team", email = "hello@frappewa.com" }
]
description = "WhatsApp Integration Module for Frappe Framework"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "whatsapp-web.js-py>=0.1.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99
